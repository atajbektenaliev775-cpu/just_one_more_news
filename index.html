<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Just One More News</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23ff8000'/%3E%3Ctext x='32' y='47' font-size='42' font-family='Georgia,serif' font-weight='bold' text-anchor='middle' fill='white'%3EJ%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#ff8000">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="top">
    <a href="#" class="logo" onclick="setRegion('all');return false">Just One More <b>News</b></a>
    <div class="right">
      <button class="icon-btn" id="search-btn" onclick="toggleSearch()" aria-label="Поиск"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
      <div id="auth-box"></div>
    </div>
  </div>
  <nav id="regions"></nav>
<div id="search-panel" hidden>
    <form onsubmit="doSearch(event)">
      <input id="q" type="search" placeholder="Поиск новостей, тем и слов" maxlength="60" autocomplete="off">
      <button class="btn">Найти</button>
      <button type="button" class="icon-btn" onclick="toggleSearch(false)" aria-label="Закрыть">✕</button>
    </form>
  </div>
</header>

<main id="app"></main>
<footer>© Just One More News</footer>

<dialog id="dlg"><button class="close" onclick="dlg.close()">✕</button><div id="dlg-body"></div></dialog>

<script>
window.addEventListener('error', function (e) {
  var m = e.message || ('Не загрузился файл: ' + (e.target && (e.target.src || e.target.href)));
  document.querySelector('main').insertAdjacentHTML('beforebegin',
    '<p style="color:#c0392b;padding:8px 16px;max-width:1100px;margin:auto">Ошибка: ' + m + '</p>');
}, true);
</script>
<script src="supabase-lite.js"></script>
<script src="app.js"></script>
</body>
</html>
